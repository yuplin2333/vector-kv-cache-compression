[project]
name = "vector"
version = "0.1.0"
description = "VECTOR: Value Estimation via Collinearity and Three-way Orthogonal Routing"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "accelerate>=1.12.0",
    "bert-score>=0.3.13",
    "datasets>=4.5.0",
    "fuzzywuzzy>=0.18.0",
    "jieba>=0.42.1",
    "kvpress>=0.5.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "rouge>=1.0.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "thefuzz>=0.22.1",
    "torch>=2.10.0",
    "tqdm>=4.67.1",
    "transformers>=4.57.0,<5.0.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "pre-commit>=4.2.0",
    "pyright[nodejs]>=1.1.403",
    "pytest>=8.4.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
flash-attn = [
    "flash-attn-3 ; sys_platform == 'linux'",
]

[tool.uv.sources]
flash-attn-3 = { url = "https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.02.17-06dc5e7/flash_attn_3-3.0.0%2B20260216.cu128torch2100cxx11abitrue.fec3a6-cp39-abi3-linux_x86_64.whl" }

[project.scripts]
vector = "vector:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportUnusedImport = true
reportUndefinedVariable = true
reportGeneralTypeIssues = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.ruff]
extend-exclude = ["drafts", "reference"]
extend-include = ["scripts/*.py"]
